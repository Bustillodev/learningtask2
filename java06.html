<!DOCTYPE html>
<html>
    <head>
        <title>.: javascript 06 :.</title>
        <style type="text/css">
            .image-container
            {   
                display: none;
            }
        </style>
        <script>
            function setNbaVisibility(value) {
                document.getElementById("nba-logo").style.display = value;
		document.getElementById("xmen-logo").style.display = value;
            }
        </script>
    </head>
    <body>
        <div class="image-container" id="nba-logo">
            <img src="nba.png" width="30%" />
        </div>
        
        [ <a href="javascript:void(0)" onClick="return setNbaVisibility('block')">Display Image</a> |
          <a href="javascript:void(0)" onClick="return setNbaVisibility('none')">Hide Image</a> 
        ]
	<div class="image-container" id="xmen-logo">
            <img src="xmen.png" width="30%" />
        </div>
        
        [ <a href="javascript:void(0)" onClick="return setNbaVisibility('block')">Display Image</a> |
          <a href="javascript:void(0)" onClick="return setNbaVisibility('none')">Hide Image</a> 
        ]
    </body>
</html>
